services:
  api:
    image: ghcr.io/she11fish/youtubepitchtransposer-api:latest
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    environment:
      - APP_PORT
      - API_URL
    ports:
      - "8000:8000"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    # volumes:
    #   - type: tmpfs
    #     target: /tmp
    #     tmpfs:
    #       size: 104857600 # 100MB
    #       mode: 1777
    #   - type: tmpfs
    #     target: /tmp/videos
    #     tmpfs:
    #       size: 104857600 # 100MB
    #       mode: 1777
    #   - type: tmpfs
    #     target: /tmp/audio
    #     tmpfs:
    #       size: 104857600 # 100MB
    #       mode: 1777
    tmpfs:
      - /tmp/vidoes
      - /tmp/audio
    restart: on-failure:5
    networks:
      - app_network
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 256M
          cpus: "4.0"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
    ulimits:
      nofile: 1024
      nproc: 256
  app:
    image: ghcr.io/she11fish/youtubepitchtransposer-app:latest
    build:
      context: ./client
      dockerfile: Dockerfile.prod
    environment:
      - NEXT_PUBLIC_API_BASE_URL
    ports:
      - "3000:3000"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    networks:
      - app_network
    restart: on-failure:5
    deploy:
      update_config:
        order: start-first
        failure_action: rollback
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    ulimits:
      nofile: 1024
      nproc: 256

networks:
  app_network:
    # driver: overlay
    # attachable: true
    driver: bridge
